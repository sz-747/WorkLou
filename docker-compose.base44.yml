services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: referrals
      POSTGRES_USER: referrals
      POSTGRES_PASSWORD: local_referrals_password
    volumes:
      - referral_db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referrals -d referrals"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - referral_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      DATABASE_URL: postgresql://referrals:local_referrals_password@db:5432/referrals
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
      WATCHPACK_POLLING: "true"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    env_file:
      - path: /run/base44/app.env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    image: alpine:3.20
    command: sh -c "sleep 60 && while true; do wget -qO- --post-data='trigger=scheduled' http://web:3000/api/verification/run || true; sleep 21600; done"
    depends_on:
      - web
volumes:
  referral_db:
  referral_node_modules:
