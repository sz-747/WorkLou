services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=lou
      - POSTGRES_PASSWORD=lou_dev_only
      - POSTGRES_DB=lousplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lou -d lousplace"]
      interval: 3s
      timeout: 3s
      retries: 20

  setup:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgres://lou:lou_dev_only@db:5432/lousplace
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install --no-audit --no-fund && npx drizzle-kit push --force && npm run db:seed"

  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://lou:lou_dev_only@db:5432/lousplace
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
    env_file:
      - path: /run/base44/app.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    command: sh -c "npx next dev -p 3000 -H 0.0.0.0"

  # Phase 7A: recurring existing-service updater. Hits the same idempotent
  # endpoint the Admin "Run updater now" button uses. (Base44's scheduler
  # can target this same URL when the app is published; this sidecar keeps
  # the recurrence working in the dev environment.)
  updater-cron:
    image: alpine:3.20
    depends_on:
      - web
    command: >
      sh -c "sleep 180;
      while true; do
        wget -q -O /dev/null --post-data='' 'http://web:3000/api/updater/run?trigger=scheduled' || true;
        sleep 3600;
      done"

  # recurring new-service discovery (Phase 7B) — hits the same HTTP endpoint
  # the manual admin button uses; Base44's scheduler can target it once published
  discovery-cron:
    image: alpine:3.20
    depends_on:
      - web
    command: >
      sh -c "sleep 300;
      while true; do
        wget -q -O /dev/null --post-data='' 'http://web:3000/api/discovery/run?trigger=scheduled' || true;
        sleep 21600;
      done"

volumes:
  pgdata:
  node_modules:
